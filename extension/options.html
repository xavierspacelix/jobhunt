<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Pengaturan JobHunter Capture</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 420px; padding: 18px; }
      label { display: block; font-size: 14px; margin-bottom: 4px; }
      input { width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 14px; }
      button { padding: 10px 16px; cursor: pointer; }
      #status { margin-top: 10px; font-size: 13px; color: #047857; }
      code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h3>Pengaturan JobHunter Capture</h3>
    <label for="appUrl">App URL</label>
    <input id="appUrl" placeholder="https://jobhunt.spacelix.qzz.io" />
    <button id="save">Simpan</button>
    <div id="status"></div>
    <p style="font-size:12px;color:#555;margin-top:16px">
      Auth memakai sesi JobHunter kamu — pastikan sudah login di app tersebut di
      browser ini. Jika belum login, extension akan arahkan ke halaman login.
    </p>
    <script src="options.js"></script>
  </body>
</html>
