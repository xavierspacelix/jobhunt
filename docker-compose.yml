# App + dev. No cron — job search is on-demand from the Lowongan page.
# Build & run (prod via Traefik):  docker compose up --build -d
# Run migrations on your DB first:  docker compose run --rm web yarn prisma migrate deploy
# Local prod mode (build + start): docker compose run --rm dev   (or: docker compose up dev)
# One-shot manual search is done from the UI ("Cari Lowongan"), no separate cron service.

services:
  web:
    build: .
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jobhunt-app.rule=Host(`jobhunt.spacelix.qzz.io`)"
      - "traefik.http.routers.jobhunt-app.entrypoints=websecure"
      - "traefik.http.routers.jobhunt-app.tls=true"
      - "traefik.http.services.jobhunt-app.loadbalancer.server.port=3000"
    restart: unless-stopped
    networks:
      - traefik-public
networks:
  traefik-public:
    external: true
