# App + dev. No cron — job search is on-demand from the Lowongan page.
# Build & run (prod via Traefik):  docker compose up --build -d
# Run migrations on your DB first:  docker compose run --rm web yarn prisma migrate deploy
# Local prod mode (build + start): docker compose run --rm dev   (or: docker compose up dev)
# One-shot manual search is done from the UI ("Cari Lowongan"), no separate cron service.

services:
  web:
    build: .
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.xavier-app.rule=Host(`jobhunt.spacelix.qzz.io`)"
      - "traefik.http.routers.xavier-app.entrypoints=websecure"
      - "traefik.http.routers.xavier-app.tls=true"
      - "traefik.http.services.xavier-app.loadbalancer.server.port=3000"
    restart: unless-stopped
    networks:
      - traefik-public

  dev:
    image: node:24-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "corepack enable && yarn install --production=false && yarn build && NODE_ENV=production yarn start"

networks:
  traefik-public:
    external: true
